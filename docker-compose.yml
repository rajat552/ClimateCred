version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: climatetwin-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: climatetwin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: climatetwin-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  climate-engine:
    build:
      context: ./services/climate-engine
      dockerfile: Dockerfile
    container_name: climatetwin-climate-engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  ai-copilot:
    build:
      context: ./services/ai-copilot
      dockerfile: Dockerfile
    container_name: climatetwin-ai-copilot
    ports:
      - "8001:8001"
    environment:
      - PORT=8001

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: climatetwin-api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/climatetwin?schema=public
      - CLIMATE_ENGINE_URL=http://climate-engine:8000
      - AI_COPILOT_URL=http://ai-copilot:8001
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
